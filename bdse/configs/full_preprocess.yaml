# Paper-faithful preprocessing overrides for BDSE/nuPlan.
# Use this for dataset generation used in final training/diagnostics/experiments,
# not for smoke tests or quick pipeline checks.
preprocess:
  resume: true
  quality_filter:
    # Dataset-quality gates are stored into teacher diagnostics.  Keep disabled
    # for materialization by default; use training.quality_filter to drop/downselect
    # old caches without rerunning preprocessing.
    require_safe_candidate: false
    min_valid_candidates: 12
    max_candidate_log_ade_min: 8.0
    max_logged_route_p95: 5.0
    exclude_teacher_hard: false
  overwrite: false
  atomic_write: true
  manifest_name: manifest.jsonl
  # Resume should be fast on large generated caches: by default we reject only
  # dot/tmp files Land tiny placeholders via stat().  Turn on
  # --resume-validate-existing for a one-time schema audit after an interrupted
  # or manually edited run.
  resume_min_file_bytes: 512
  resume_validate_existing: false
  # 10 lidar frames at the paper's 10 Hz feature cadence gives 1 Hz training
  # timesteps. Use 5 for 2 Hz if you need denser samples for an ablation.
  scenario_stride: 10
  # ScenarioBuilder is already timestamp-thinned by scenario_stride.  Do not expand
  # every scenario-local iteration unless running a dense-window ablation.
  scenario_iteration_policy: initial
  # Leave null for exhaustive generation. Set via --max-samples-per-log for
  # balanced wall-clock tests without taking only the first log.
  max_samples_per_log: null
  # When capped, select uniformly placed short temporal blocks instead of
  # isolated single frames. This keeps broad per-log coverage while making nearby
  # selected frames share exact 8 s future/history windows for cache reuse.
  max_samples_per_log_strategy: uniform_blocks
  max_samples_per_log_block_size: 32
  # The paper-faithful pipeline is dominated by exact nuPlan DB/map I/O on cold
  # temporal windows.  On a 48C/96T workstation, 12 materialization threads keeps
  # enough independent logs active to hide cold-cache latency without overwhelming
  # SQLite/map APIs.  For smaller machines, override with --num-workers.
  num_workers: 12
  max_in_flight: 12
  scenario_builder_workers: 8
  # Keep one in-flight preprocessing job per log while still using workers across
  # different logs.  This makes the exact 8s future/history frame cache useful.
  cache_local_scheduler: true
  cache_local_log_parallelism: 1
  compress_npz: false
  profile: false
  profile_threshold_s: 2.0
  # Reuse reconstructed nuPlan tracked-object/ego frames across overlapping
  # scenario windows. This preserves labels because misses still call the same
  # nuPlan APIs; hits only avoid repeated DB object reconstruction.
  temporal_frame_cache: true
  # Large enough for multiple active logs plus their 2s history / 8s future
  # windows; otherwise high-worker runs evict warm frames before reuse.
  temporal_frame_cache_max_entries: 65536
  # With 1 Hz samples and 10 Hz futures, adjacent 8s windows differ by ~10 tail frames.
  # 1--2 Hz selected samples differ by ~10--20 future frames.  Exact tail fills
  # are far cheaper than rebuilding the full 80-frame nuPlan bulk future, while
  # cold 80-frame misses still use the bulk API.
  temporal_frame_cache_individual_miss_threshold: 32
  # In threaded preprocessing, coalesce exact bulk cache fills per log/direction so
  # overlapping windows do not reconstruct the same nuPlan frames simultaneously.
  temporal_frame_cache_coalesce_bulk: true
  # Keep past history behavior conservative for now: past bulk windows are short,
  # and exact past-by-iteration support varies more across devkit versions.
  temporal_frame_cache_past_individual_miss_threshold: 0
  # logged = paper-faithful exact future tracked-object labels.  cv skips the
  # expensive future tracked-object DB window and uses selected-agent CV proxies;
  # use cv only for fast pipeline/model-validation runs, not final paper labels.
  label_agent_future_mode: logged
  # logged = exact past tracked-object history. current_repeat/none avoid the
  # expensive past tracked-object DB window and are useful for fast verification.
  runtime_agent_history_mode: logged
  candidate_aware_agent_selection: true
runtime:
  history_s: 2.0
  history_hz: 10
  map_radius_m: 100.0
  agent_radius_m: 80.0
  max_agents: 32
  max_map_polylines: 128
  include_drivable_polygons: false
  # No current BDSE evidence atom consumes crosswalk polygons. Keeping this off
  # preserves teacher labels while avoiding expensive nuPlan map scans.
  include_crosswalks: false
  max_drivable_polygons: 24
  max_polygon_points: 128
  max_route_points: 512
  route_horizon_m: 220.0
  route_resample_step_m: 2.0
  max_route_connection_gap_m: 12.0
  use_future_traffic_lights_for_teacher: false
candidate:
  # Paper/default appendix setting. K=32 keeps the BDSE proof/ablation setup
  # aligned with the candidate table while cutting candidate-linear teacher work.
  K: 32
  horizon_s: 8.0
  step_s: 0.1
  # For final labels, mask dynamically impossible rollouts.  The previous
  # relaxed setting was useful for smoke tests but lets broken route centerlines
  # enter the teacher argmin and creates noisy hard events.
  valid_requires_dynamic: true
  include_history_priors: true
  conflict_stop_count: 6
  conflict_route_radius_m: 8.0
  conflict_stop_clearance_m: 8.0
  conflict_agent_time_stride: 5
  dynamic_eval_quantile: 0.98
  dynamic_low_speed_mps: 0.3
  repair_low_valid_count: true
  min_valid_candidates: 16
  stop_distance_grid_m: [5, 10, 15, 20, 30, 40, 55, 70]
  counts:
    keep_follow: 8
    decelerate_stop: 8
    yield_creep: 4
    lane_change_left: 3
    lane_change_right: 3
    route_turn_connector: 3
    safe_fallback: 3
evidence:
  max_atoms: 128
  max_interaction_atoms: 36
  max_interaction_agents: 12
  interaction_candidate_radius_m: 30.0
  interaction_route_radius_m: 7.0
  interaction_close_radius_m: 18.0
  interaction_ahead_limit_m: 90.0
  max_map_atoms: 32
  max_kinematic_atoms: 16
  include_interaction: true
  include_rule_map: true
  include_kinematic: true
  include_hard_atoms: true
  budget: 16
  safety:
    # Keep final labels at 10 Hz, but suppress only hard collision frames that are
    # effectively universal across the finite valid candidate bank.  Soft occupancy
    # costs still see the full agent tube.
    collision_shared_frame_fraction: 0.98
    collision_shared_min_candidates: 4
teacher:
  robust:
    enabled: true
  demo_weight: 10.0
  demo_scale: 100.0
  atom_normalization_first: true
  separate_hard_gate: false
  use_reactive_proxy: true
  # Full 10 Hz teacher evidence evaluation. Do not raise this for final labels.
  cost_eval_stride: 1
pairs:
  winner_top_l: 16
  target_min: 64
  target_max: 256
  pair_batch_per_scene: 128
  eta_percentile: 20
selector:
  mode: runtime_predicted
tournament:
  L_infer: 31

calibration:
  epsilon_cal: 0.0
