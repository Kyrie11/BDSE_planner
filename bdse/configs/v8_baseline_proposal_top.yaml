calibration:
  epsilon_cal: 0.0
evidence:
  budget: 16
fallback:
  enabled: true
  max_additional_stages: 1
  rule_rerank_top_k: 5
  rule_switch_margin: 0.0
model:
  margin_normalization_min_scale: 20000.0
  margin_normalization_quantile: 0.9
  pair_head_residual_over_local: true
  pair_margin_normalized: true
pairs:
  pair_batch_per_scene: 64
  target_max: 128
planner:
  baseline_mode: proposal_top
preprocess:
  candidate_aware_agent_selection: false
runtime:
  include_drivable_polygons: false
  pair_delta_hybrid_local_weight: 0.0
  skip_candidate_aware_agent_selection: true
  use_pair_conditioned_margins: true
selector:
  force_fill_budget: true
  force_hard_topm: true
  mandatory_hard_quota: 4
  maneuver_pair_count: 4
  maneuver_rivals: 4
  min_selected_atoms: 16
  normalized_eta_pred: 0.05
  normalized_gamma_max: 3.0
  progress_pair_count: 4
  progress_rivals: 4
  proposal_fill_weight: 0.5
  proposal_top_m: 32
  runtime_pair_cap_multiplier: 1.0
  structural_safety_include_feasibility: true
tournament:
  L_infer: 12
  epsilon_cal: 0.0
training:
  action_conditioned_action_loss_weight: 0.0
  action_loss_start_epoch: 2
  decision_weight_hard_crossing_pair: 1.0
  decision_weight_near_margin: 0.25
  decision_weight_near_pair: 2.0
  decision_weight_safety_pairs: true
  decision_weight_teacher_pair: 3.0
  epsilon_cal_normalized: 0.5
  exclude_hard_action_pairs_from_pair_regression: true
  exclude_safety_atoms_from_pair_regression: true
  interaction_atom_pair_weight: 3.0
  loss_weights:
    action: 4.0
    atom_cost: 0.2
    base: 0.5
    full_action: 3.0
    full_interface_rank_aux: 2.0
    full_margin: 2.0
    hard_feasibility: 3.0
    pair: 2.0
    proposal: 4.0
    residual: 1.0
    uncertainty: 0.02
  normalize_atom_cost_loss: true
  normalize_calibration_loss: true
  normalize_pair_losses: true
  normalized_huber_delta: 0.25
  pair_action_loss_weight: 1.0
  pair_margin_min_scale: 20000.0
  predicted_selector_start_epoch: 6
  proposal_decisive_hard_gain_boost: 0.0
  proposal_decisive_hard_weight: 1.0
  proposal_focus_interaction_only: true
  proposal_include_decisive_hard: false
  proposal_interaction_gain_boost: 2.0
  upweight_interaction_atoms: true
