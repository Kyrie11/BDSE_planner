evidence:
  budget: 16
  max_atoms: 128
  unit_cost: true
fallback:
  budget_stages:
  - 16
  enabled: false
  max_additional_stages: 0
  proposal_multiplier: 3.0
  rival_stages:
  - 16
  - 31
  rule_rerank_top_k: 5
planner:
  baseline_mode: external_policy
  replan_cache_max_distance_m: 8.0
  replan_cache_max_elapsed_s: 2.5
  replan_cache_max_heading_rad: 0.8
  replan_interval_ticks: 10
runtime:
  baseline_pair_tournament: false
  use_pair_conditioned_margins: false
selector:
  force_fill_budget: true
  force_hard_topm: true
  mandatory_hard_quota: 3
  min_selected_atoms: 16
  proposal_top_m: 24
  runtime_pair_cap_multiplier: 1.0
tournament:
  L_infer: 16
  beta_uncertainty: 0.0
  epsilon_cal: 0.0
external_baseline:
  enabled: true
  variant: pluto
  budget: 16
  hidden_dim: 256
  transformer_layers: 4
  attention_heads: 8
  state_dropout: 0.75
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  epochs: 25
  loss_weights:
    action: 1.0
    cost: 0.75
    pair: 0.0
    proposal: 0.25
  implementation_label: PLUTO-inspired budget adapter
  reference_paper: 'PLUTO: Pushing the Limit of Imitation Learning-based Planning
    for Autonomous Driving'
  reference_source: https://github.com/jchengai/pluto
  implementation_fidelity: partial
  planner_supervision: expert_imitation
  state_dropout_encoder: attention_token_sde
