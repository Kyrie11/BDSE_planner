seed: 17
paths:
  data_cache_root: /data0/senzeyu2/dataset/nuplan/data/cache
  maps_root: /data0/senzeyu2/dataset/nuplan/maps
  exp_root: /data0/nuplan/senzeyu2/dataset/nuplan/data/cache
  preprocessed_cache: /data0/nuplan/exp/bdse/cache
  map_version: nuplan-maps-v1.0
data:
  split_folders:
    train:
      - train_boston
      - train_pittsburgh
      - train_singapore
    val:
      - val
preprocess:
  resume: true
  quality_filter:
    # Dataset-quality gates are stored into teacher diagnostics.  Keep disabled
    # for materialization by default; use training.quality_filter to drop/downselect
    # old caches without rerunning preprocessing.
    require_safe_candidate: false
    min_valid_candidates: 12
    max_candidate_log_ade_min: 8.0
    max_logged_route_p95: 5.0
    exclude_teacher_hard: false
  overwrite: false
  atomic_write: true
  manifest_name: manifest.jsonl
  scenario_stride: 10
  # nuPlan ScenarioBuilder already applies scenario_stride via timestamp_threshold_s.
  # Keep one BDSE sample per timestamp-filtered builder scenario by default.
  # Use 'expanded' only for dense-window ablations; it can multiply val/train by
  # 10x--100x and creates highly overlapping labels.
  scenario_iteration_policy: initial
  max_samples_per_log_strategy: uniform_blocks
  # Strategy for --max-scenarios-per-split after all eligible scenarios are indexed.
  # This avoids order-biased first-N subsets when building paper-scale probes.
  max_scenarios_strategy: uniform_blocks
  # Optional nuPlan ScenarioBuilder discovery cap. Leave null for paper probes;
  # setting it is faster but can bias the subset before BDSE balancing is applied.
  scenario_filter_limit_total_scenarios: null
  max_samples_per_log_block_size: 32
  num_workers: 1
  max_in_flight: 2
  # With temporal frame caching, run at most one materialization from the same
  # nuPlan log at a time and parallelize across logs.  This preserves labels but
  # prevents adjacent windows from all cold-missing and waiting on the same DB fill.
  cache_local_scheduler: true
  compress_npz: false
  profile: false
  profile_threshold_s: 2.0
  # Reuse reconstructed nuPlan tracked-object/ego frames across overlapping
  # scenario windows. This preserves labels because misses still call the same
  # nuPlan APIs; hits only avoid repeated DB object reconstruction.
  temporal_frame_cache: true
  temporal_frame_cache_max_entries: 8192
  # With 1 Hz samples and 10 Hz futures, adjacent 8s windows differ by ~10 tail frames.
  # 1--2 Hz selected samples differ by ~10--20 future frames.  Exact tail fills
  # are far cheaper than rebuilding the full 80-frame nuPlan bulk future, while
  # cold 80-frame misses still use the bulk API.
  temporal_frame_cache_individual_miss_threshold: 32
  # In threaded preprocessing, coalesce exact bulk cache fills per log/direction so
  # overlapping windows do not reconstruct the same nuPlan frames simultaneously.
  temporal_frame_cache_coalesce_bulk: true
  # Keep past history behavior conservative for now: past bulk windows are short,
  # and exact past-by-iteration support varies more across devkit versions.
  temporal_frame_cache_past_individual_miss_threshold: 0
  # logged = paper-faithful exact future tracked-object labels.  cv skips the
  # expensive future tracked-object DB window and uses selected-agent CV proxies;
  # use cv only for fast pipeline/model-validation runs, not final paper labels.
  label_agent_future_mode: logged
  # logged = exact past tracked-object history. current_repeat/none avoid the
  # expensive past tracked-object DB window and are useful for fast verification.
  runtime_agent_history_mode: logged
  # False keeps preprocessing and closed-loop runtime from extracting DB/map features twice.
  # Turn on only for an ablation that needs candidate-proximity agent reordering.
  candidate_aware_agent_selection: false
runtime:
  history_s: 2.0
  history_hz: 10
  map_radius_m: 100.0
  agent_radius_m: 80.0
  max_agents: 32
  max_map_polylines: 128
  # Full drivable-area polygon extraction is expensive on nuPlan.  The teacher still
  # has an off-route/off-drivable hard atom via the route-corridor fallback.
  include_drivable_polygons: false
  max_drivable_polygons: 24
  max_polygon_points: 128
  max_route_points: 256
  use_future_traffic_lights_for_teacher: false
  use_pair_conditioned_margins: true
candidate:
  K: 32
  # Generate a larger cheap runtime-only candidate pool, then prune back to K.
  # This improves safe/logged-action coverage without increasing the model tensor
  # size or teacher evidence cost.
  pool_K: 64
  prune_pool_to_K: true
  include_terminal_progress_priors: true
  terminal_progress_count: 12
  prune_preserve_safe: 4
  prune_preserve_conflict: 4
  prune_preserve_history: 4
  horizon_s: 8.0
  step_s: 0.1
  # Keep candidates in the bank even if they slightly exceed dynamic comfort;
  # comfort/evidence costs, not the mask, should rank them down.
  valid_requires_dynamic: true
  include_history_priors: true
  conflict_stop_count: 6
  conflict_route_radius_m: 8.0
  conflict_stop_clearance_m: 8.0
  conflict_agent_time_stride: 5
  stop_distance_grid_m: [5, 10, 15, 20, 30, 40, 55, 70]
  lane_width_m: 3.5
  route_width_m: 4.0
  max_accel: 3.0
  max_decel: -5.0
  max_jerk: 5.0
  max_curvature: 0.25
  max_curvature_rate: 0.20
  max_lateral_accel: 3.0
  # Use high-percentile dynamic envelopes rather than one-frame maxima so route
  # discretization kinks and stop-profile clamps do not collapse the valid bank.
  dynamic_eval_quantile: 0.98
  dynamic_low_speed_mps: 0.3
  repair_low_valid_count: true
  min_valid_candidates: 16
  counts:
    keep_follow: 8
    decelerate_stop: 8
    yield_creep: 4
    lane_change_left: 3
    lane_change_right: 3
    route_turn_connector: 3
    safe_fallback: 3
evidence:
  max_atoms: 128
  max_interaction_atoms: 36
  max_interaction_agents: 12
  interaction_candidate_radius_m: 30.0
  interaction_route_radius_m: 7.0
  interaction_close_radius_m: 18.0
  interaction_ahead_limit_m: 90.0
  max_map_atoms: 32
  max_kinematic_atoms: 16
  include_interaction: true
  include_rule_map: true
  include_kinematic: true
  include_hard_atoms: true
  budget: 16
  unit_cost: true
  eps: 1.0e-6
  weights:
    occupancy: 10.0
    collision: 100.0
    ttc: 4.0
    gap: 2.0
    yield: 20.0
    red_light: 50.0
    drivable_area: 50.0
    wrong_way: 50.0
    route_connector: 2.0
    speed_limit: 5.0
    local_comfort: 1.0
  scales:
    occupancy: 800.0
    collision: 1.0
    ttc: 8.0
    gap: 64.0
    yield: 1.0
    red_light: 1.0
    drivable_area: 1.0
    wrong_way: 1.0
    route_connector: 4.0
    speed_limit: 4.0
    local_comfort: 80.0
  caps:
    hard: 200.0
    inter: 6.0
    rule: 20.0
    map: 20.0
    kin: 10.0
  safety:
    d_safe_m: 2.0
    tau_safe_s: 2.0
    tau_gap_s: 1.5
    front_gap_m: 8.0
    rear_gap_m: 12.0
    boundary_margin_m: 0.5
    collision_raw: 32000.0
    red_raw: 100.0
    off_raw: 100.0
    wrong_raw: 100.0
    yield_raw: 20.0
    collision_min_frames: 2
    # Ignore first-few-frame overlaps that all candidates inherit before ego can react.
    collision_grace_s: 0.5
    # If an occupancy hard-overlap frame is shared by almost every valid candidate,
    # treat it as non-decision hard evidence and keep only its soft proximity cost.
    # This avoids no-safe candidate sets caused by unavoidable current-frame or
    # non-reactive-agent-tube artifacts while preserving candidate-specific crashes.
    collision_shared_frame_fraction: 0.98
    collision_shared_min_candidates: 4
    off_drivable_min_frames: 3
    off_drivable_slack_m: 0.75
    wrong_way_min_frames: 3
    red_light_route_radius_m: 10.0
    red_light_min_progress_m: -2.0
    red_light_max_progress_m: 120.0
teacher:
  robust:
    enabled: true
  robust_modes:
    logged: {enabled: true, prob: 0.35}
    cv: {enabled: true, prob: 0.20}
    ca: {enabled: true, prob: 0.10}
    brake: {enabled: true, prob: 0.15}
    yield: {enabled: true, prob: 0.10}
    nonyield: {enabled: true, prob: 0.10}
  risk_aggregation:
    type: mean_cvar
    cvar_alpha: 0.9
    cvar_weight: 0.4
  feasibility:
    hard_priority_scale: 10000.0
    inject_hard_priority_costs: true
  route_weight: 50.0
  progress_weight: 5.0
  comfort_global_weight: 1.0
  demo_weight: 1.0
  atom_normalization_first: true
  separate_hard_gate: false
  use_reactive_proxy: true
  cost_eval_stride: 1
  demo_scale: 120.0
  route_scale: 1.0
  progress_scale: 10.0
  comfort_scale: 80.0
pairs:
  winner_top_l: 16
  target_min: 64
  target_max: 256
  pair_batch_per_scene: 128
  eta_percentile: 20
  random_seed: 17
selector:
  mode: runtime_predicted
  proposal_top_m: 32
  # Runtime pair screens are bidirectional by default so a candidate that is
  # worse under the cheap base score can still be promoted by decisive evidence.
  bidirectional_pairs: true
  reverse_pair_weight: 1.0
  runtime_pair_cap_multiplier: 2.0
  gamma_cap_percentile: 95
  gamma_max_default: 100.0
  lambda_near: 1.0
  lambda_safety: 2.0
  preserve_safety_pairs: true
  eta_pred: 1.0
  hab_enabled: true
  hab_reserve_fraction: 0.2
  hab_free_budget: null
  # Information bonus and prior variance used by the uncertainty-aware HAB
  # selector before an atom-action evidence query has been made.
  lambda_info: 0.1
  unqueried_atom_variance: 1.0
  stop_gradient: true
tournament:
  L_infer: 16
  beta_uncertainty: 1.0
  epsilon_cal: 0.0
  use_softmin: true
  softmin_tau: 1.0
fallback:
  enabled: true
  expand_rivals: true
  expand_budget: true
  rule_rerank_top_k: 5
  tau_delta: 0.1
  safety_lcb_min: 0.0
  proposal_multiplier: 3.0
  rival_stages: [16, 31]
  budget_stages: [16, 32]
  rule_switch_margin: 0.0
model:
  hidden_dim: 256
  transformer_layers: 4
  attention_heads: 8
  evidence_feature_dim: 24
  proposal_feature_dim: 24
  query_feature_dim: 12
  map_feature_dim: 8
  route_feature_dim: 8
  traffic_feature_dim: 12
  goal_feature_dim: 4
  max_polyline_points: 64
  max_traffic_tokens: 32
  dropout: 0.1
  # Families are indexed 0..5: padding, feasibility, reachability_interaction,
  # precedence, decision_boundary, dynamic_regularity.  Keep this in sync
  # with bdse.planner.evidence_queries.FAMILY_NAMES.
  num_families: 6
  variance_floor: 1.0e-4
  pair_conditioned: true
  pair_delta_scale: 1.0
  map_token_dropout: 0.25
  route_token_dropout: 0.05
  traffic_token_dropout: 0.05
training:
  quality_filter:
    enabled: false
    require_safe_candidate: true
    min_valid_candidates: 12
    max_candidate_log_ade_min: 8.0
    max_logged_route_p95: 5.0
    exclude_teacher_hard: false
  lr: 1.0e-4
  weight_decay: 1.0e-2
  batch_size: 64
  epochs: 20
  grad_clip: 5.0
  num_workers: 4
  teacher_soft_target_tau: 1.0
  loss_weights:
    base: 1.0
    pair: 1.0
    residual: 1.0
    atom_cost: 0.25
    uncertainty: 0.1
    full_interface_rank_aux: 0.1
    family: 0.5
    proposal: 1.0
    action: 1.0
    calibration: 0.0
  rank_margin: 1.0
  rank_tau: 1.0
  pair_zero_weight: 0.1
  atom_zero_weight: 0.1
  pair_action_loss_weight: 1.0
  action_conditioned_action_loss_weight: 0.25

calibration:
  epsilon_cal: 0.0
