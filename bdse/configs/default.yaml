seed: 17
paths:
  data_cache_root: /data0/senzeyu2/dataset/nuplan/data/cache
  maps_root: /data0/senzeyu2/dataset/nuplan/maps
  exp_root: /data0/nuplan/senzeyu2/dataset/nuplan/data/cache
  preprocessed_cache: /data0/nuplan/exp/bdse/cache
  map_version: nuplan-maps-v1.0
data:
  split_folders:
    train:
      - train_boston
      - train_pittsburgh
      - train_singapore
    val:
      - val
preprocess:
  resume: true
  overwrite: false
  atomic_write: true
  manifest_name: manifest.jsonl
  scenario_stride: 10
runtime:
  history_s: 2.0
  history_hz: 10
  map_radius_m: 100.0
  agent_radius_m: 80.0
  max_agents: 32
  max_map_polylines: 128
  use_future_traffic_lights_for_teacher: false
candidate:
  K: 32
  horizon_s: 8.0
  step_s: 0.1
  lane_width_m: 3.5
  route_width_m: 4.0
  max_accel: 3.0
  max_decel: -5.0
  max_jerk: 5.0
  max_curvature: 0.25
  max_curvature_rate: 0.20
  max_lateral_accel: 3.0
  counts:
    keep_follow: 8
    decelerate_stop: 6
    yield_creep: 4
    lane_change_left: 4
    lane_change_right: 4
    route_turn_connector: 4
    safe_fallback: 2
evidence:
  max_atoms: 128
  max_interaction_atoms: 64
  max_map_atoms: 32
  max_kinematic_atoms: 16
  include_interaction: true
  include_rule_map: true
  include_kinematic: true
  include_hard_atoms: true
  budget: 16
  unit_cost: true
  eps: 1.0e-6
  weights:
    occupancy: 20.0
    collision: 100.0
    ttc: 20.0
    gap: 15.0
    yield: 20.0
    red_light: 50.0
    drivable_area: 50.0
    wrong_way: 50.0
    route_connector: 10.0
    speed_limit: 10.0
    local_comfort: 1.0
  scales:
    occupancy: 320.0
    collision: 1.0
    ttc: 4.0
    gap: 10.0
    yield: 1.0
    red_light: 1.0
    drivable_area: 1.0
    wrong_way: 1.0
    route_connector: 1.0
    speed_limit: 4.0
    local_comfort: 80.0
  caps:
    hard: 100.0
    inter: 20.0
    rule: 20.0
    map: 20.0
    kin: 10.0
  safety:
    d_safe_m: 2.0
    tau_safe_s: 2.0
    tau_gap_s: 1.5
    front_gap_m: 8.0
    rear_gap_m: 12.0
    boundary_margin_m: 0.5
    collision_raw: 100.0
    red_raw: 50.0
    off_raw: 50.0
    wrong_raw: 50.0
    yield_raw: 20.0
teacher:
  route_weight: 50.0
  progress_weight: 5.0
  comfort_global_weight: 1.0
  demo_weight: 1.0
  atom_normalization_first: true
  separate_hard_gate: false
  use_reactive_proxy: false
  demo_scale: 320.0
  route_scale: 1.0
  progress_scale: 10.0
  comfort_scale: 80.0
pairs:
  winner_top_l: 16
  target_min: 64
  target_max: 256
  pair_batch_per_scene: 128
  eta_percentile: 20
  random_seed: 17
selector:
  mode: runtime_predicted
  gamma_cap_percentile: 95
  gamma_max_default: 100.0
  lambda_near: 1.0
  lambda_safety: 2.0
  eta_pred: 1.0
  stop_gradient: true
tournament:
  L_infer: 16
  beta_uncertainty: 0.0
  use_softmin: true
  softmin_tau: 1.0
fallback:
  enabled: true
  expand_rivals: true
  expand_budget: true
  rule_rerank_top_k: 5
  tau_delta: 0.1
model:
  hidden_dim: 256
  transformer_layers: 4
  attention_heads: 8
  evidence_feature_dim: 24
  query_feature_dim: 12
  dropout: 0.1
training:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  batch_size: 64
  epochs: 20
  grad_clip: 5.0
  num_workers: 4
  loss_weights:
    base: 1.0
    residual: 1.0
    rank: 1.0
    selection: 0.5
    action: 1.0
  rank_margin: 1.0
