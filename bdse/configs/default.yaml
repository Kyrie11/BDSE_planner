seed: 17
paths:
  data_cache_root: /data0/senzeyu2/dataset/nuplan/data/cache
  maps_root: /data0/senzeyu2/dataset/nuplan/maps
  exp_root: /data0/nuplan/senzeyu2/dataset/nuplan/data/cache
  preprocessed_cache: /data0/nuplan/exp/bdse/cache
  map_version: nuplan-maps-v1.0
data:
  split_folders:
    train:
      - train_boston
      - train_pittsburgh
      - train_singapore
    val:
      - val
preprocess:
  resume: true
  overwrite: false
  atomic_write: true
  manifest_name: manifest.jsonl
  scenario_stride: 10
  max_samples_per_log_strategy: uniform_blocks
  max_samples_per_log_block_size: 32
  num_workers: 1
  max_in_flight: 2
  # With temporal frame caching, run at most one materialization from the same
  # nuPlan log at a time and parallelize across logs.  This preserves labels but
  # prevents adjacent windows from all cold-missing and waiting on the same DB fill.
  cache_local_scheduler: true
  compress_npz: false
  profile: false
  profile_threshold_s: 2.0
  # Reuse reconstructed nuPlan tracked-object/ego frames across overlapping
  # scenario windows. This preserves labels because misses still call the same
  # nuPlan APIs; hits only avoid repeated DB object reconstruction.
  temporal_frame_cache: true
  temporal_frame_cache_max_entries: 8192
  # With 1 Hz samples and 10 Hz futures, adjacent 8s windows differ by ~10 tail frames.
  temporal_frame_cache_individual_miss_threshold: 12
  # In threaded preprocessing, coalesce exact bulk cache fills per log/direction so
  # overlapping windows do not reconstruct the same nuPlan frames simultaneously.
  temporal_frame_cache_coalesce_bulk: true
  # False keeps preprocessing and closed-loop runtime from extracting DB/map features twice.
  # Turn on only for an ablation that needs candidate-proximity agent reordering.
  candidate_aware_agent_selection: false
runtime:
  history_s: 2.0
  history_hz: 10
  map_radius_m: 100.0
  agent_radius_m: 80.0
  max_agents: 32
  max_map_polylines: 128
  # Full drivable-area polygon extraction is expensive on nuPlan.  The teacher still
  # has an off-route/off-drivable hard atom via the route-corridor fallback.
  include_drivable_polygons: false
  max_drivable_polygons: 12
  max_polygon_points: 64
  max_route_points: 256
  use_future_traffic_lights_for_teacher: false
candidate:
  K: 32
  horizon_s: 8.0
  step_s: 0.1
  # Keep candidates in the bank even if they slightly exceed dynamic comfort;
  # comfort/evidence costs, not the mask, should rank them down.
  valid_requires_dynamic: false
  include_history_priors: true
  conflict_stop_count: 6
  conflict_route_radius_m: 8.0
  conflict_stop_clearance_m: 8.0
  conflict_agent_time_stride: 5
  stop_distance_grid_m: [5, 10, 15, 20, 30, 40, 55, 70]
  lane_width_m: 3.5
  route_width_m: 4.0
  max_accel: 3.0
  max_decel: -5.0
  max_jerk: 5.0
  max_curvature: 0.25
  max_curvature_rate: 0.20
  max_lateral_accel: 3.0
  # Use high-percentile dynamic envelopes rather than one-frame maxima so route
  # discretization kinks and stop-profile clamps do not collapse the valid bank.
  dynamic_eval_quantile: 0.98
  dynamic_low_speed_mps: 0.3
  repair_low_valid_count: true
  min_valid_candidates: 16
  counts:
    keep_follow: 8
    decelerate_stop: 8
    yield_creep: 4
    lane_change_left: 3
    lane_change_right: 3
    route_turn_connector: 3
    safe_fallback: 3
evidence:
  max_atoms: 128
  max_interaction_atoms: 36
  max_interaction_agents: 12
  interaction_candidate_radius_m: 30.0
  interaction_route_radius_m: 7.0
  interaction_close_radius_m: 18.0
  interaction_ahead_limit_m: 90.0
  max_map_atoms: 32
  max_kinematic_atoms: 16
  include_interaction: true
  include_rule_map: true
  include_kinematic: true
  include_hard_atoms: true
  budget: 16
  unit_cost: true
  eps: 1.0e-6
  weights:
    occupancy: 10.0
    collision: 100.0
    ttc: 4.0
    gap: 2.0
    yield: 20.0
    red_light: 50.0
    drivable_area: 50.0
    wrong_way: 50.0
    route_connector: 2.0
    speed_limit: 5.0
    local_comfort: 1.0
  scales:
    occupancy: 800.0
    collision: 1.0
    ttc: 8.0
    gap: 64.0
    yield: 1.0
    red_light: 1.0
    drivable_area: 1.0
    wrong_way: 1.0
    route_connector: 4.0
    speed_limit: 4.0
    local_comfort: 80.0
  caps:
    hard: 200.0
    inter: 6.0
    rule: 20.0
    map: 20.0
    kin: 10.0
  safety:
    d_safe_m: 2.0
    tau_safe_s: 2.0
    tau_gap_s: 1.5
    front_gap_m: 8.0
    rear_gap_m: 12.0
    boundary_margin_m: 0.5
    collision_raw: 32000.0
    red_raw: 100.0
    off_raw: 100.0
    wrong_raw: 100.0
    yield_raw: 20.0
    collision_min_frames: 2
    # Ignore first-few-frame overlaps that all candidates inherit before ego can react.
    collision_grace_s: 0.5
    # If an occupancy hard-overlap frame is shared by almost every valid candidate,
    # treat it as non-decision hard evidence and keep only its soft proximity cost.
    # This avoids no-safe candidate sets caused by unavoidable current-frame or
    # non-reactive-agent-tube artifacts while preserving candidate-specific crashes.
    collision_shared_frame_fraction: 0.98
    collision_shared_min_candidates: 4
    off_drivable_min_frames: 3
    off_drivable_slack_m: 0.75
    wrong_way_min_frames: 3
    red_light_route_radius_m: 10.0
    red_light_min_progress_m: -2.0
    red_light_max_progress_m: 120.0
teacher:
  route_weight: 50.0
  progress_weight: 5.0
  comfort_global_weight: 1.0
  demo_weight: 8.0
  atom_normalization_first: true
  separate_hard_gate: false
  use_reactive_proxy: false
  cost_eval_stride: 2
  demo_scale: 120.0
  route_scale: 1.0
  progress_scale: 10.0
  comfort_scale: 80.0
pairs:
  winner_top_l: 16
  target_min: 64
  target_max: 256
  pair_batch_per_scene: 128
  eta_percentile: 20
  random_seed: 17
selector:
  mode: runtime_predicted
  gamma_cap_percentile: 95
  gamma_max_default: 100.0
  lambda_near: 1.0
  lambda_safety: 2.0
  eta_pred: 1.0
  stop_gradient: true
tournament:
  L_infer: 16
  beta_uncertainty: 0.0
  use_softmin: true
  softmin_tau: 1.0
fallback:
  enabled: true
  expand_rivals: true
  expand_budget: true
  rule_rerank_top_k: 5
  tau_delta: 0.1
model:
  hidden_dim: 256
  transformer_layers: 4
  attention_heads: 8
  evidence_feature_dim: 24
  query_feature_dim: 12
  dropout: 0.1
training:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  batch_size: 64
  epochs: 20
  grad_clip: 5.0
  num_workers: 4
  loss_weights:
    base: 1.0
    residual: 1.0
    rank: 1.0
    selection: 0.5
    action: 1.0
  rank_margin: 1.0
