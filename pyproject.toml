[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdse-nuplan"
version = "0.1.0"
description = "Budgeted Decision-Sufficient Evidence planner implementation for nuPlan-style DB data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pyyaml>=6.0",
  "torch>=1.13",
  "tqdm>=4.64"
]

[project.optional-dependencies]
nuplan = ["nuplan-devkit"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bdse*"]
