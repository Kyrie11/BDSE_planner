seed: 17
paths:
  data_cache_root: /data0/senzeyu2/dataset/nuplan/data/cache
  maps_root: /data0/senzeyu2/dataset/nuplan/maps
  exp_root: /data0/nuplan/senzeyu2/dataset/nuplan/data/cache
  preprocessed_cache: /data0/nuplan/exp/bdse/cache
  map_version: nuplan-maps-v1.0
data:
  split_folders:
    train:
    - train_boston
    - train_pittsburgh
    - train_singapore
    val:
    - val
preprocess:
  resume: true
  quality_filter:
    require_safe_candidate: false
    min_valid_candidates: 12
    max_candidate_log_ade_min: 8.0
    max_logged_route_p95: 5.0
    exclude_teacher_hard: false
  overwrite: false
  atomic_write: true
  manifest_name: manifest.jsonl
  scenario_stride: 10
  scenario_iteration_policy: initial
  max_samples_per_log_strategy: uniform_blocks
  max_scenarios_strategy: uniform_blocks
  scenario_filter_limit_total_scenarios: null
  max_samples_per_log_block_size: 32
  num_workers: 1
  max_in_flight: 2
  cache_local_scheduler: true
  compress_npz: false
  profile: false
  profile_threshold_s: 2.0
  temporal_frame_cache: true
  temporal_frame_cache_max_entries: 8192
  temporal_frame_cache_individual_miss_threshold: 32
  temporal_frame_cache_coalesce_bulk: true
  temporal_frame_cache_past_individual_miss_threshold: 0
  label_agent_future_mode: logged
  runtime_agent_history_mode: logged
  candidate_aware_agent_selection: false
runtime:
  history_s: 2.0
  history_hz: 10
  map_radius_m: 100.0
  agent_radius_m: 80.0
  max_agents: 32
  max_map_polylines: 128
  include_drivable_polygons: true
  max_drivable_polygons: 24
  max_polygon_points: 128
  max_route_points: 256
  max_route_tokens: 8
  use_future_traffic_lights_for_teacher: false
  use_pair_conditioned_margins: true
candidate:
  K: 32
  pool_K: 96
  prune_pool_to_K: true
  include_terminal_progress_priors: true
  terminal_progress_count: 12
  prune_preserve_safe: 8
  prune_preserve_conflict: 8
  prune_preserve_history: 4
  horizon_s: 8.0
  step_s: 0.1
  valid_requires_dynamic: true
  include_history_priors: true
  conflict_stop_count: 10
  conflict_route_radius_m: 8.0
  conflict_stop_clearance_m: 8.0
  conflict_agent_time_stride: 5
  stop_distance_grid_m:
  - 5
  - 10
  - 15
  - 20
  - 30
  - 40
  - 55
  - 70
  lane_width_m: 3.5
  route_width_m: 4.0
  max_accel: 3.0
  max_decel: -5.0
  max_jerk: 5.0
  max_curvature: 0.25
  max_curvature_rate: 0.2
  max_lateral_accel: 3.0
  dynamic_eval_quantile: 0.98
  dynamic_low_speed_mps: 0.3
  repair_low_valid_count: true
  min_valid_candidates: 16
  counts:
    keep_follow: 8
    decelerate_stop: 7
    yield_creep: 5
    lane_change_left: 3
    lane_change_right: 3
    route_turn_connector: 2
    safe_fallback: 4
evidence:
  max_atoms: 128
  max_interaction_atoms: 36
  max_interaction_agents: 12
  interaction_candidate_radius_m: 30.0
  interaction_route_radius_m: 7.0
  interaction_close_radius_m: 18.0
  interaction_ahead_limit_m: 90.0
  max_map_atoms: 32
  max_kinematic_atoms: 16
  include_interaction: true
  include_rule_map: true
  include_kinematic: true
  include_hard_atoms: true
  budget: 32
  unit_cost: true
  eps: 1.0e-06
  weights:
    occupancy: 10.0
    collision: 100.0
    ttc: 4.0
    gap: 2.0
    yield: 20.0
    red_light: 50.0
    drivable_area: 50.0
    wrong_way: 50.0
    route_connector: 2.0
    speed_limit: 5.0
    local_comfort: 1.0
  scales:
    occupancy: 800.0
    collision: 1.0
    ttc: 8.0
    gap: 64.0
    yield: 1.0
    red_light: 1.0
    drivable_area: 1.0
    wrong_way: 1.0
    route_connector: 4.0
    speed_limit: 4.0
    local_comfort: 80.0
  caps:
    hard: 200.0
    inter: 6.0
    rule: 20.0
    map: 20.0
    kin: 10.0
  safety:
    d_safe_m: 2.0
    tau_safe_s: 2.0
    tau_gap_s: 1.5
    front_gap_m: 8.0
    rear_gap_m: 12.0
    boundary_margin_m: 0.5
    collision_raw: 32000.0
    red_raw: 100.0
    off_raw: 100.0
    wrong_raw: 100.0
    yield_raw: 20.0
    collision_min_frames: 2
    collision_grace_s: 0.5
    collision_shared_frame_fraction: 0.98
    collision_shared_min_candidates: 4
    off_drivable_min_frames: 3
    off_drivable_slack_m: 0.75
    wrong_way_min_frames: 3
    red_light_route_radius_m: 10.0
    red_light_min_progress_m: -2.0
    red_light_max_progress_m: 120.0
teacher:
  robust:
    enabled: true
  robust_modes:
    logged:
      enabled: true
      prob: 0.35
    cv:
      enabled: true
      prob: 0.2
    ca:
      enabled: true
      prob: 0.1
    brake:
      enabled: true
      prob: 0.15
    yield:
      enabled: true
      prob: 0.1
    nonyield:
      enabled: true
      prob: 0.1
  risk_aggregation:
    type: mean_cvar
    cvar_alpha: 0.9
    cvar_weight: 0.4
  feasibility:
    hard_priority_scale: 10000.0
    inject_hard_priority_costs: true
  route_weight: 50.0
  progress_weight: 5.0
  comfort_global_weight: 1.0
  demo_weight: 1.0
  atom_normalization_first: true
  separate_hard_gate: false
  use_reactive_proxy: true
  cost_eval_stride: 1
  demo_scale: 120.0
  route_scale: 1.0
  progress_scale: 10.0
  comfort_scale: 80.0
pairs:
  winner_top_l: 16
  target_min: 64
  target_max: 256
  pair_batch_per_scene: 128
  eta_percentile: 20
  random_seed: 17
selector:
  mode: runtime_predicted
  progress_pair_count: 8
  maneuver_pair_count: 8
  progress_rivals: 4
  maneuver_rivals: 4
  min_family_topm_slots:
    1: 4
    2: 6
    3: 3
  proposal_top_m: 64
  bidirectional_pairs: true
  reverse_pair_weight: 1.0
  runtime_pair_cap_multiplier: 2.0
  force_hard_topm: true
  max_forced_hard_topm: 32
  mandatory_hard_quota: 6
  min_selected_atoms: 12
  force_fill_budget: true
  gamma_cap_percentile: 95
  gamma_max_default: 100.0
  lambda_near: 1.0
  lambda_safety: 2.0
  preserve_safety_pairs: true
  eta_pred: 1.0
  hab_enabled: true
  hab_reserve_fraction: 0.2
  hab_free_budget: null
  lambda_info: 0.1
  unqueried_atom_variance: 1.0
  stop_gradient: true
  structural_safety_include_feasibility: true
  normalized_gamma_max: 5.0
  normalized_eta_pred: 0.1
tournament:
  L_infer: 31
  beta_uncertainty: 1.0
  epsilon_cal: 0.0
  use_softmin: true
  softmin_tau: 1.0
fallback:
  enabled: true
  expand_rivals: true
  expand_budget: true
  rule_rerank_top_k: 5
  tau_delta: 0.1
  safety_lcb_min: 0.0
  proposal_multiplier: 3.0
  rival_stages:
  - 16
  - 31
  budget_stages:
  - 32
  - 64
  rule_switch_margin: 0.0
model:
  hidden_dim: 256
  action_set_summary_dim: 16
  transformer_layers: 4
  attention_heads: 8
  evidence_feature_dim: 24
  proposal_feature_dim: 24
  query_feature_dim: 18
  map_feature_dim: 8
  route_feature_dim: 8
  traffic_feature_dim: 12
  goal_feature_dim: 4
  max_polyline_points: 64
  max_traffic_tokens: 32
  dropout: 0.1
  num_families: 6
  variance_floor: 0.0001
  pair_conditioned: true
  pair_delta_scale: 1.0
  map_token_dropout: 0.25
  route_token_dropout: 0.05
  traffic_token_dropout: 0.05
  pair_margin_normalized: true
training:
  quality_filter:
    enabled: false
    require_safe_candidate: true
    min_valid_candidates: 12
    max_candidate_log_ade_min: 8.0
    max_logged_route_p95: 5.0
    exclude_teacher_hard: false
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 64
  epochs: 20
  grad_clip: 5.0
  num_workers: 4
  teacher_soft_target_tau: 1.0
  loss_weights:
    base: 1.0
    pair: 1.0
    residual: 1.0
    atom_cost: 0.25
    uncertainty: 0.1
    full_interface_rank_aux: 0.1
    family: 0.5
    proposal: 2.0
    action: 1.0
    full_action: 1.0
    full_margin: 0.5
    hard_feasibility: 0.5
    calibration: 0.0
  rank_margin: 1.0
  rank_tau: 1.0
  pair_zero_weight: 0.1
  atom_zero_weight: 0.1
  pair_action_loss_weight: 1.0
  action_conditioned_action_loss_weight: 0.0
  hard_action_targets: true
  pair_margin_scale: 0.0
  pair_margin_min_scale: 100.0
  normalize_pair_losses: true
  normalize_atom_cost_loss: true
  normalize_calibration_loss: true
  normalized_huber_delta: 1.0
  uncertainty_normalized_var_floor: 0.05
  uncertainty_normalized_var_ceiling: 20.0
  uncertainty_nll_clamp: 20.0
  uncertainty_nll_min: 0.0
  atom_cost_min_scale: 100.0
  pair_margin_reg_weight: 1.0
  pair_margin_reg_delta: 1.0
  full_action_min_scale: 1.0
  full_margin_tau: 1.0
  full_margin_min_scale: 100.0
  hard_feasibility_margin: 10.0
  hard_feasibility_tau: 1.0
  hard_feasibility_min_scale: 100.0
  proposal_positive_weight: 6.0
  proposal_decisive_hard_weight: 1.0
  proposal_decisive_hard_gain_boost: 0.0
  proposal_rank_weight: 1.0
  exclude_safety_atoms_from_pair_regression: true
  exclude_hard_action_pairs_from_pair_regression: true
  decision_weight_teacher_pair: 2.0
  decision_weight_near_pair: 1.0
  decision_weight_near_margin: 0.5
  decision_weight_hard_crossing_pair: 1.0
  decision_weight_safety_pairs: true
  upweight_interaction_atoms: true
  interaction_atom_pair_weight: 2.0
  proposal_focus_interaction_only: true
  proposal_include_decisive_hard: false
  proposal_interaction_gain_boost: 1.0
  action_loss_start_epoch: 4
  predicted_selector_start_epoch: 8
  epsilon_cal_normalized: 1.0
calibration:
  epsilon_cal: 0.0
planner:
  baseline_mode: bdse
