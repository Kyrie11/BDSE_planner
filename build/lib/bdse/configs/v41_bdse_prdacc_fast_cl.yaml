  deployment_coreset_swap_passes: 1
  deployment_coreset_score_weight: 1.0
  deployment_coreset_action_weight: 4.0
  deployment_coreset_gap_weight: 2.0
  deployment_coreset_margin_weight: 1.0
  # v40 Lex-DACC: action preservation is a hard lexicographic priority.
  # 0 scans all feasible removals only when the cheap top-k has no preserving step.
  deployment_coreset_lexicographic_action_preservation: true
  deployment_coreset_preservation_scan_candidates: 0
  deployment_coreset_repair_one_swap: true
  # Exact deployment evaluations are CPU-only and reuse cached pair deltas.
  deployment_coreset_repair_two_swap_candidates: 256

  # v41 PR-DACC: align the cheap search graph to the final rival graph, then
  # use a bounded action-diverse beam only on v40-style preservation failures.
  # The beam permits temporary action flips while searching for a final B=16
  # subset that restores the full-Top-M deployment action.
  deployment_coreset_use_deployment_pair_graph: true
  deployment_coreset_beam_width: 12
  deployment_coreset_beam_branch: 14
  deployment_coreset_beam_max_evaluations: 2400
  deployment_coreset_beam_mismatch_fraction: 0.42
