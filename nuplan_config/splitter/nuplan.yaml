# Compatibility no-op splitter config for nuPlan Hydra simulation.
# Some nuPlan-devkit checkouts keep `splitter: nuplan` in
# default_simulation.yaml even though the splitter group is not shipped in the
# simulation config tree. Closed-loop simulation does not need dataset splitting,
# but Hydra must still be able to resolve the defaults-list entry before the
# run can start.
#
# Keeping this node null preserves runtime behavior and does not change BDSE
# training or planner logic.
null